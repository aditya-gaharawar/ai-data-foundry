name: ai-data-foundry
x-python: &python
  image: datafoundry-python:local
  build:
    context: .
    dockerfile: infra/Python.Dockerfile
    secrets: [system_ca]
  env_file: .env
  environment: &runtime
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    S3_ENDPOINT: http://minio:9000
    TEMPORAL_ADDRESS: temporal:7233
    API_INTERNAL_URL: http://api:8000
    LOCAL_WEBHOOK_URL: http://webhook-receiver:9100/events
    NO_PROXY: localhost,127.0.0.1,postgres,minio,temporal,api,webhook-receiver
  depends_on:
    postgres: {condition: service_healthy}
    minio: {condition: service_healthy}
    temporal: {condition: service_started}
  init: true
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/health]
      interval: 3s
      timeout: 3s
      retries: 30
  temporal:
    image: temporalio/temporal:1.4.1@sha256:9844298258519ebece82b3253f1ee1fc4eb8d87b7abcc264cfb676be342c74a5
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal-1.4.1.db --ui-ip 0.0.0.0
    environment:
      NO_PROXY: localhost,127.0.0.1,0.0.0.0,temporal
      no_proxy: localhost,127.0.0.1,0.0.0.0,temporal
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporal-data:/data"]
    depends_on:
      temporal-data-init: {condition: service_completed_successfully}
  temporal-data-init:
    image: temporalio/temporal:1.4.1@sha256:9844298258519ebece82b3253f1ee1fc4eb8d87b7abcc264cfb676be342c74a5
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:1000 /data"]
    volumes: ["temporal-data:/data"]
    network_mode: none
  api:
    <<: *python
    command: sh -c 'alembic upgrade head && python -m foundry.bootstrap && uvicorn foundry.api:app --host 0.0.0.0 --port 8000 --no-access-log'
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *python
    command: python -m foundry.worker
    depends_on:
      api: {condition: service_healthy}
  web:
    image: datafoundry-web:local
    build:
      context: .
      dockerfile: infra/Web.Dockerfile
      secrets: [system_ca]
    environment:
      API_INTERNAL_URL: http://api:8000
      NO_PROXY: localhost,127.0.0.1,api
      NODE_ENV: production
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
  webhook-receiver:
    <<: *python
    command: python scripts/webhook_receiver.py
    ports: ["127.0.0.1:9100:9100"]
volumes:
  postgres-data:
  minio-data:
  temporal-data:
secrets:
  system_ca:
    file: /etc/ssl/certs/ca-certificates.crt
