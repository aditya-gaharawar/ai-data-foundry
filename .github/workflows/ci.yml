name: Local core verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install -g pnpm@11.25.0
      - run: python -m pip install uv==0.13.4
      - run: make bootstrap
      - name: Install pinned local test engines
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libsm6 libxrender1 libxi6 libxxf86vm1 libgl1
          make local-model
          uv run python scripts/setup_blender.py --env-output .local/blender.env
          cat .local/blender.env >> "$GITHUB_ENV"
      - run: pnpm exec playwright install-deps chromium
      - name: Start real services
        run: |
          make dev > /tmp/foundry-dev.log 2>&1 &
          uv run python scripts/wait_ready.py
      - run: make lint
      - run: make test
      - run: make test-integration
      - run: make test-security
      - run: make test-e2e
      - run: make smoke
      - run: uv run python scripts/verify_fresh_database.py
      - run: pnpm build
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            verification/evidence/screenshots
            verification/evidence/p06/screenshots
            verification/evidence/p07-p12/screenshots
