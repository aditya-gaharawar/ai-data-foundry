[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-data-foundry"
version = "0.1.0"
description = "Local API-first training dataset lifecycle"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]>=0.38,<1",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.44,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.17,<2",
  "boto3>=1.40,<2",
  "temporalio==1.35.0",
  "argon2-cffi>=25,<26",
  "cryptography==50.0.2",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "python-dotenv>=1.2,<2",
  "typer>=0.20,<1",
  "pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[project.scripts]
datafoundry = "foundry.cli:app"

[project.optional-dependencies]
local-model = [
    "llama-cpp-python==0.3.19",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/foundry", "packages/sdk-python/datafoundry"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires live local services", "security: authorization and policy negatives"]
